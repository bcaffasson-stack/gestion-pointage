# Render Blueprint - Deploie le backend Spring Boot + PostgreSQL
# Ce fichier doit etre a la RACINE du depot Github (Render le detecte
# automatiquement via New > Blueprint).
#
# Le backend est dans backend/ (rootDir). Render construit l'image Docker
# avec backend/Dockerfile et cree la base PostgreSQL pointage-db.

databases:
  - name: pointage-db
    databaseName: pointage_db
    user: pointage_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: pointage-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      # Variables separees pour construire l'URL JDBC postgresql (voir application.properties)
      - key: DB_HOST
        fromDatabase:
          name: pointage-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pointage-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pointage-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pointage-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pointage-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://votre-frontend.vercel.app
      - key: PDF_OUTPUT_DIR
        value: /tmp/pdf-output
      - key: PORT
        value: 10000
    healthCheckPath: /api/health