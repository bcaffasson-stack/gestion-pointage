# Render Blueprint - Deploie le backend Spring Boot + PostgreSQL
# Utilisation: importer ce fichier dans Render (New > Blueprint) ou
# creer un Web Service + une PostgreSQL manuellement.
#
# Important: ce fichier doit etre a la racine du repertoire backend/
# de votre depot GitHub.

databases:
  - name: pointage-db
    databaseName: pointage_db
    user: pointage_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: pointage-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: pointage-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: pointage-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pointage-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://votre-frontend.vercel.app
      - key: PDF_OUTPUT_DIR
        value: /tmp/pdf-output
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
