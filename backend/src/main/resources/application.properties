spring.application.name=gestion-pointage-api

# =============================================================================
# Configuration cloud-ready : toutes les valeurs critiques proviennent de
# variables d'environnement (params) avec des valeurs par defaut pour le dev
# local. En production, surcharger via les variables d'environnement.
# =============================================================================

# PostgreSQL (local par defaut, cloud en prod via DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pointage_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# update : ne detruit pas les donnees existantes, ajoute seulement les changements de schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# dialecte PostgreSQL (auto-detecte, specifie explicitement pour l'anciennete)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (cle a surcharger en production via JWT_SECRET)
jwt.secret=${JWT_SECRET:GestionPointageSecretKey2026VeryLongAndSecureKeyForJwtTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# PDF output (repertoire a monter/volume en prod)
pdf.output.dir=${PDF_OUTPUT_DIR:./pdf-output}

# CORS (origines du frontend ; en prod mettre l'URL du frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Port du serveur
server.port=${PORT:8080}
